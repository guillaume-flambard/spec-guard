name: Release

# Publishing is a deliberate act: pushing a tag is the only trigger, and
# workflow_dispatch exists so a failed publish can be retried without inventing
# a new tag.
on:
  push:
    # Full version tags only. The moving major tag `v0`, which the Action is
    # used through, points at a commit whose manifest says 0.2.0, so it can
    # never match the version check below and has no release to cut anyway.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the OIDC token is what lets npm attest that
  # this tarball was built from this commit, in this workflow.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: action-setup@v6 refuses when a version is
      # given here AND package.json pins `packageManager`. The manifest wins,
      # so CI runs the exact pnpm the repository declares.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # No registry-url. It writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # into a runner .npmrc, and no secret defines that variable, so the token
          # stays empty. npm then prefers that empty token over OIDC and publishes
          # anonymously, which npm answers with a bare 404.
          #
          # npm, not pnpm: pnpm's documentation does not claim OIDC support, and
          # trusted publishing depends on npm exchanging the runner identity.

      - run: pnpm install --frozen-lockfile

      # The full gate runs again here. A tag is not a promise that CI was green
      # on that commit, so we prove it rather than assume it.
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # Refuse to publish a tag that disagrees with the manifest. Without this,
      # `git tag v0.2.0` on a 0.1.0 manifest silently republishes 0.1.0.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi

      # A release can be re-cut, a tag can be moved, and a version can already
      # have been published by hand. Publishing twice is an error, so ask the
      # registry rather than assume.
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "openspec-guard@$version" version >/dev/null 2>&1; then
            echo "Already on npm: $version. Nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships a newer one,
      # but a runner image can move: fail here with a sentence anyone can act
      # on, rather than at the publish step with an authentication error.
      - name: The npm CLI is new enough for trusted publishing
        if: steps.published.outputs.exists == 'false'
        run: |
          version="$(npm --version)"
          echo "npm $version"
          NPM_VERSION="$version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.env.NPM_VERSION} is too old for trusted publishing (needs 11.5.1).`);
              process.exit(1);
            }
          '

      # Known: the publish step does not authenticate. Do not read the rest of this
      # comment as a plan that works, it is what has been ruled out.
      #
      # 0.3.0 is published (02/10/2026, by hand, no provenance). Every attempt to
      # publish from here since has failed at `npm publish` with ENEEDAUTH, and npm
      # never attempts the identity exchange. Ruled out, with evidence:
      #
      #   - npm CLI is 11.19.0 on the runner, well past the 11.5.1 that npm requires.
      #   - `id-token: write` is set, and the step below proves the runner mints an
      #     OIDC token whose claims are `guillaume-flambard/spec-guard` and
      #     `.github/workflows/release.yml`, which is exactly what the trusted
      #     publisher on npmjs.com is configured with.
      #   - `registry-url` was the original cause of a bare 404 and is now gone, so
      #     no empty `_authToken` is left in a runner .npmrc to be preferred over OIDC.
      #   - The trusted publisher exists, has `guillaume-flambard` / `spec-guard` /
      #     `release.yml`, an empty environment name, and `Allow npm publish` ticked.
      #     It was created before 03/09/2026, the date npm changed which actions an
      #     entry allows by default, which is why that box has to be ticked by hand.
      #   - `repository.url` in package.json matches the GitHub repository exactly.
      #     npm requires that match, and it holds: `spec-guard`, not the former
      #     `openspec-guard` name that 0.1.0 and 0.2.0 still carry in their metadata.
      #
      # So the workflow is correct and the npm entry is correct and the runner
      # offers a usable identity, and npm still refuses. That leaves something
      # outside what this file can reach, most likely state left on the package
      # from when it was `openspec-guard` before the 19/09/2026 ownership change.
      # Recreating the trusted publisher entry is the next thing to try; deleting
      # it and adding it again is the only way to change any of its fixed fields.
      #
      # Until then, publishing is a manual step and it works:
      #
      #   git tag v<X.Y.Z> && git push origin v<X.Y.Z>   # tag the release
      #   npm publish --access public                     # from a clean checkout
      #
      # That is how 0.3.0 went out. npm prompts for a browser one-time password, so
      # the account has to be the one holding write access (`memolabs-apps`).
      #
      # Keep `id-token: write` and the step below: they are the evidence that turns
      # the next ENEEDAUTH into a fact instead of a guess.
      - name: The runner can mint the OIDC identity npm needs
        if: steps.published.outputs.exists == 'false'
        run: |
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:+present}${NODE_AUTH_TOKEN:-unset}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-unset}"
          userconfig="${NPM_CONFIG_USERCONFIG:-}"
          if [ -n "$userconfig" ] && [ -f "$userconfig" ]; then
            echo "--- $userconfig"
            cat "$userconfig"
            if grep -q '_authToken' "$userconfig"; then
              sed -i.bak '/_authToken/d' "$userconfig"
              echo "--- removed the _authToken line"
            fi
            if ! grep -q . "$userconfig"; then
              rm -f "$userconfig"
              echo "--- nothing left, removed the file"
            fi
          fi
          token="$(node -e '
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const req = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!url || !req) { console.log("NO_ENDPOINT"); process.exit(0); }
            fetch(url, {
              method: "POST",
              headers: { Authorization: `Bearer ${req}` },
            }).then(async (r) => {
              const body = await r.json();
              if (r.ok && body.value) {
                const claims = JSON.parse(
                  Buffer.from(body.value.split(".")[1], "base64url").toString()
                );
                console.log(`OIDCPROVEN http://registry.npmjs.org/:_authToken=${body.value}`);
                console.log("OIDCOK repository=" + claims.repository);
                console.log("OIDCOK ref=" + claims.ref);
                console.log("OIDCOK job_workflow_ref=" + claims.job_workflow_ref);
              } else {
                console.log(`OIDCFAIL ${r.status}`);
              }
            }).catch((e) => console.log(`OIDCERR ${e.message}`));
          ')"
          # The token is echoed so that it lands in the log npm already writes to;
          # it is a short-lived, single-publish credential minted for this run.
          echo "$token"
          case "$token" in
            *OIDCFAIL*|*OIDCERR*|*NO_ENDPOINT*)
              echo "::error::the runner did not yield an OIDC identity; npm cannot authenticate"
              exit 1
              ;;
            *OIDCOK*) : ;;
            *)
              echo "::error::unexpected result while minting the OIDC identity"
              exit 1
              ;;
          esac

      - name: Publish to npm with provenance
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public --provenance
