name: Release

# Publishing is a deliberate act: pushing a tag is the only trigger, and
# workflow_dispatch exists so a failed publish can be retried without inventing
# a new tag.
on:
  push:
    # Full version tags only. A tag is the only way a version reaches npm.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the OIDC token is what lets npm attest that
  # this tarball was built from this commit, in this workflow.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: action-setup@v6 refuses when a version is
      # given here AND package.json pins `packageManager`. The manifest wins,
      # so CI runs the exact pnpm the repository declares.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The full gate runs again here. A tag is not a promise that CI was green
      # on that commit, so we prove it rather than assume it.
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # Refuse to publish a tag that disagrees with the manifest. Without this,
      # `git tag v0.2.0` on a 0.1.0 manifest silently republishes 0.1.0.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi

      # A release can be re-cut, a tag can be moved, and a version can already
      # have been published by hand. Publishing twice is an error, so ask the
      # registry rather than assume.
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@zoanlogia/aidd-guard@$version" version >/dev/null 2>&1; then
            echo "Already on npm: $version. Nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships a newer one,
      # but a runner image can move: fail here with a sentence anyone can act
      # on, rather than at the publish step with an authentication error that
      # sends the reader looking for a missing token.
      - name: The npm CLI is new enough for trusted publishing
        if: steps.published.outputs.exists == 'false'
        run: |
          version="$(npm --version)"
          echo "npm $version"
          NPM_VERSION="$version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`npm ${process.env.NPM_VERSION} is too old for trusted publishing (needs 11.5.1).`);
              process.exit(1);
            }
          '

      # No token anywhere, on purpose.
      #
      # npm removed classic and automation tokens in November 2025, and the
      # "bypass 2FA" option on a granular token is itself being removed: it
      # cannot do account actions since August 2026 and stops publishing
      # entirely in January 2027. Trusted publishing is what replaces them.
      # npm trades the workflow's OIDC identity for a short-lived credential,
      # so the only thing that can publish this package is this workflow, in
      # this repository. `id-token: write` above is what makes that possible,
      # and it is also what signs the provenance attestation.
      #
      # The other side of it lives on npmjs.com: the package's trusted
      # publisher must name this repository and the file name `release.yml`,
      # exactly. npm does not validate that entry when it is saved, so a typo
      # there only ever surfaces here.
      - name: Publish to npm with provenance
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public --provenance
