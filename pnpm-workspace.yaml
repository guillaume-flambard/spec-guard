# pnpm 11 no longer reads the "pnpm" field of package.json: settings live here.
# esbuild is a transitive dependency of vitest and needs its postinstall script
# to place its native binary.
allowBuilds:
  esbuild: true

packages:
  - 'packages/*'
  # aidd-guard is parked until it runs on the core. Plan 2 removes this line.
  - '!packages/aidd-guard'
